name: Generate Pac-Man Graph

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/pacman.yml"
      - ".github/pacman/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Plays Pac-Man across your contribution graph and writes SVGs into ./dist
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # Restyle into the neon arcade look. If this ever fails, the plain
      # SVGs are still published, so your profile never breaks.
      - name: Neon arcade restyle
        continue-on-error: true
        run: node .github/pacman/neonize.js dist/pacman-contribution-graph-dark.svg dist/pacman-neon.svg

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
